<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Students - Attendance Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="nav"></div>
<main>
<h1>Students</h1>
<p class="sub">Click a student to see their attendance details.</p>
<div class="toolbar">
  <input type="search" id="search" placeholder="Search name or A-1">
  <select id="division"><option value="all">All classes</option><option value="A">Class A</option><option value="B">Class B</option></select>
  <label>Attendance for <select id="subject"></select></label>
</div>
<p class="note" id="scopeNote" style="margin:-6px 0 14px"></p>
<div class="tablewrap"><table>
  <thead><tr><th>Roll No</th><th>Name</th><th>Class</th><th id="attHead">Attendance</th><th>Progress</th></tr></thead>
  <tbody id="tbody"></tbody>
</table></div>
</main>
<script src="js/data.js"></script>
<script src="js/students.js"></script>
</body></html>
